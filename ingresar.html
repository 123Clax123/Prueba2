    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- importamos materialize.css -->
    <link type="text/css" rel="stylesheet" href="css/materialize.min.css">
    <link rel="icon" href="imagenes/libro.png" type="image/x-icon">

</head>

<body>
    <nav class="green">
        <div class="nav-wrapper container">
            <a href="index.html" class="brand-logo">
                <img src="imagenes/logoSena.png" style="width: 65px;">
            </a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">

    <div class='container section'>
        <div class="row card-panel">
            <form class="col s12">
                <div class="input-field col s6">
                    <label for="nombre">Ingresa tu nombre</label>
                    <input type="text" id="nombre" placeholder="Nombre" class="validate" required>
                </div>
                <div class="input-field col s6">
                    <label for="apellido">Ingresa tu apellido</label>
                    <input type="text" id="apellido" placeholder="Apellido" class="validate" required>
                </div>
                <div class="input-field col s12">
                    <i class="material-icons prefix">call_received</i>
                    <label for="email">Ingresa tu email</label>
                    <input type="email" id="email" placeholder="E-mail" class="validate" required>
                </div>
                <button class="btn waves-effect right light-green" type="submit" name="enviar">Enviar
                    <i class="material-icons right">brush</i>
                </button>
            </form>
        </div>
    </div>


    <footer class="page-footer green">
        <div class="container">
            <div class="row">
                <div class="col l6 s12">
                    <h5 class="white-text">Servicio Nacional de Aprendizaje SENA</h5>

                    </ul>
                </div>
            </div>
        </div>
    </footer>
